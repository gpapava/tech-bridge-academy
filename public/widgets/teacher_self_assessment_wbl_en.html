<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teacher Self-Assessment on Work-Based Learning Competences</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --brand:#185FA5; --brand-strong:#124a80; --brand-tint:#E8F0F8;
  --cyan:#00A0E0; --cyan-soft:#D7EFFA; --deep:#104050;
  --paper:#FFFFFF; --surface:#F6F8FB; --surface-2:#EEF3F8;
  --ink:#16212B; --ink-soft:#51606E; --line:#DCE4EC; --line-strong:#C3D0DC;
  --l1:#C0504D; --l2:#E0A33E; --l3:#5B9BD5; --l4:#4E9A6B;
  --radius:12px; --maxw:860px;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --brand:#5CA8E8; --brand-strong:#8AC2F0; --brand-tint:#12293f; --cyan:#2BB6EE; --cyan-soft:#0d3b52;
  --paper:#0E1620; --surface:#131E2A; --surface-2:#182636;
  --ink:#E7EEF5; --ink-soft:#9DB0C0; --line:#26374a; --line-strong:#31465c;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --brand:#5CA8E8; --brand-strong:#8AC2F0; --brand-tint:#12293f; --cyan:#2BB6EE; --cyan-soft:#0d3b52;
  --paper:#0E1620; --surface:#131E2A; --surface-2:#182636;
  --ink:#E7EEF5; --ink-soft:#9DB0C0; --line:#26374a; --line-strong:#31465c;
}}
*,*::before,*::after{box-sizing:inherit;}
html{scroll-behavior:smooth; scroll-padding-top:120px;}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto;} *{transition:none!important;}}
body{margin:0; background:var(--paper); color:var(--ink); font-family:"Inter",system-ui,sans-serif; font-size:16.5px; line-height:1.6; -webkit-font-smoothing:antialiased;}
.top{position:sticky; top:0; z-index:50; background:color-mix(in srgb,var(--paper) 92%,transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); padding:calc(env(safe-area-inset-top,0px) + 11px) 20px 11px;}
.top-in{max-width:var(--maxw); margin:0 auto; display:flex; align-items:center; gap:12px;}
.crumb{font-size:12.5px; color:var(--ink-soft); display:flex; gap:7px; align-items:center; flex-wrap:wrap; min-width:0;}
.crumb b{color:var(--brand); font-weight:600;} .crumb .sep{color:var(--line-strong);} .crumb .here{color:var(--ink); font-weight:600;}
.toggle{margin-left:auto; flex-shrink:0; border:1px solid var(--line-strong); background:var(--surface); color:var(--ink); border-radius:999px; padding:6px 12px; font-size:12.5px; font-weight:600; cursor:pointer; display:flex; gap:6px;}
.progwrap{max-width:var(--maxw); margin:0 auto; padding:10px 20px 0;}
.progbar{height:6px; background:var(--surface-2); border-radius:999px; overflow:hidden;}
.progbar i{display:block; height:100%; background:var(--brand); width:0; transition:width .3s;}
.progtxt{font-size:12px; color:var(--ink-soft); margin-top:6px;}
main{max-width:var(--maxw); margin:0 auto; padding:24px 20px 60px;}
h1{font-family:"Fraunces",serif; font-weight:500; font-size:clamp(24px,4.5vw,34px); line-height:1.14; margin:4px 0 6px;}
.sub{color:var(--ink-soft); max-width:62ch; margin:0 0 6px;}
.howto{background:var(--brand-tint); border-radius:var(--radius); padding:14px 18px; margin:16px 0; font-size:14.5px; color:var(--ink);}
.howto b{color:var(--brand-strong);}
.step{display:none;} .step.show{display:block; animation:fade .25s;}
@keyframes fade{from{opacity:0}to{opacity:1}}
.areahead{display:flex; align-items:baseline; gap:12px; margin:8px 0 2px;}
.areahead .an{font-family:"Fraunces"; color:var(--brand); font-weight:600; font-size:15px;}
h2{font-family:"Fraunces",serif; font-weight:500; font-size:clamp(21px,3.2vw,27px); margin:4px 0 4px;}
.scalekey{font-size:12.5px; color:var(--ink-soft); margin:0 0 16px; display:flex; gap:14px; flex-wrap:wrap;}
.scalekey span b{color:var(--ink);}
.item{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin:12px 0;}
.item .q{font-weight:600; font-size:15.5px; margin-bottom:12px;}
.scale{display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:10px;}
.scale button{font:inherit; font-weight:600; font-size:14px; padding:10px 6px; border-radius:9px; border:1.5px solid var(--line-strong); background:var(--paper); color:var(--ink-soft); cursor:pointer; transition:.12s; text-align:center;}
.scale button .lv{display:block; font-family:"Fraunces"; font-size:17px; margin-bottom:2px;}
.scale button:hover{border-color:var(--brand);}
.scale button.sel{color:#fff;}
.scale button.sel[data-v="1"]{background:var(--l1); border-color:var(--l1);}
.scale button.sel[data-v="2"]{background:var(--l2); border-color:var(--l2);}
.scale button.sel[data-v="3"]{background:var(--l3); border-color:var(--l3);}
.scale button.sel[data-v="4"]{background:var(--l4); border-color:var(--l4);}
.evid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
@media(max-width:560px){.evid{grid-template-columns:1fr;}}
.evid textarea, .fld input, .fld textarea{width:100%; font:inherit; font-size:14px; padding:9px 11px; border:1px solid var(--line); border-radius:8px; background:var(--paper); color:var(--ink); resize:vertical;}
.evid label, .fld label{font-size:12px; font-weight:600; color:var(--ink-soft); display:block; margin-bottom:4px;}
.fld{margin:12px 0;}
.devgrid{overflow-x:auto; border:1px solid var(--line); border-radius:var(--radius); margin:14px 0;}
table.dev{border-collapse:collapse; width:100%; min-width:620px; font-size:14px;}
table.dev th,table.dev td{padding:9px 10px; border-bottom:1px solid var(--line); text-align:left; vertical-align:middle;}
table.dev th{background:var(--surface-2); font-weight:600; font-size:12.5px;}
table.dev .lvcell{text-align:center;}
table.dev input[type=radio]{accent-color:var(--brand); width:17px; height:17px;}
table.dev input[type=text]{width:100%; font:inherit; font-size:13px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--paper); color:var(--ink);}
.rubric{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:14px 18px; margin:16px 0; font-size:14px;}
.rubric .rt{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--brand); margin-bottom:8px;}
.rubric div{padding:6px 0; border-top:1px dashed var(--line);} .rubric div:first-of-type{border-top:none;}
.rubric b{font-family:"Fraunces";}
.reflect textarea{min-height:60px;}
.nav{display:flex; gap:10px; justify-content:space-between; margin-top:24px;}
.nav button{font:inherit; font-weight:600; font-size:15px; padding:11px 20px; border-radius:10px; cursor:pointer; border:1px solid var(--brand); }
.nav .next{background:var(--brand); color:#fff;} .nav .prev{background:transparent; color:var(--brand);}
.nav button:disabled{opacity:.4; cursor:default;}
/* result */
.result{display:none;} .result.show{display:block;}
.bar{display:flex; align-items:center; gap:12px; margin:10px 0;}
.bar .lbl{width:170px; font-size:14px; flex-shrink:0;}
@media(max-width:560px){.bar .lbl{width:120px; font-size:13px;}}
.bar .track{flex:1; height:22px; background:var(--surface-2); border-radius:6px; overflow:hidden;}
.bar .fill{height:100%; border-radius:6px; transition:width .5s;}
.bar .val{width:30px; text-align:right; font-weight:700; font-family:"Fraunces";}
.printbtn{background:var(--cyan); color:var(--deep); border:none; font-weight:700;}
:root[data-theme="dark"] .printbtn{color:#07222e;}
.note{font-size:12.5px; color:var(--ink-soft); font-style:italic; margin-top:16px;}
@media print{
  .top,.progwrap,.nav,.toggle,.howto{display:none!important;}
  .step{display:block!important;} .result{display:block!important;}
  body{font-size:12px;} main{padding:0;}
}

.oplist{background:var(--surface-2); border:1px solid var(--line); border-radius:10px; padding:12px 14px; margin:4px 0 14px; display:flex; gap:18px; flex-wrap:wrap; align-items:center;}
.oplist .opt-t{font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-right:4px;}
.oplist .opt{display:inline-flex; gap:7px; align-items:center; font-size:14px; cursor:pointer;}
.oplist .opt input{accent-color:var(--brand); width:17px; height:17px;}
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <div class="crumb"><b>Tech Bridge Academy</b><span class="sep">›</span><b>School Area</b><span class="sep">›</span><span class="here">Staff Development</span></div>
  <button class="toggle" onclick="toggleTheme()"><span id="tglIcon">🌙</span><span id="tglTxt">Dark</span></button>
</div></div>
<div class="progwrap"><div class="progbar"><i id="prog"></i></div><div class="progtxt" id="progtxt">Step 1 of 9</div></div>
<main id="main"></main>
<script>
const AREAS=[
 {t:"Teaching for Work-Based Learning", items:["I design authentic activities.","I use real problems or professional situations.","I promote reflection and the transfer of learning.","I assess competences through evidence."]},
 {t:"Knowledge of the business world", items:["I know the main production processes in my sector.","I know the professional roles companies require.","I know the technological innovations in the sector.","I can engage in dialogue with companies using a shared language."]},
 {t:"Collaboration with companies", items:["I involve companies in designing pathways.","I schedule regular meetings with company tutors.","I share target competences and assessment criteria.","I collect feedback from companies."]},
 {t:"Developing student autonomy", items:["Students make decisions.","Students work in groups.","Students handle real problems.","Students reflect on their own learning."]},
 {t:"Continuing professional development", items:["I keep up to date with technologies.","I take part in company visits or in-company training.","I share practices with colleagues.","I use up-to-date sources on the labour market."]},
 {t:"Professional reflection", items:["I evaluate the effectiveness of pathways.","I document experiences.","I make improvements every year.","I use feedback to redesign."]}
];
const DEVICES=["School-based WBL / curricular work placements","Traineeship","Apprenticeship (initial VET)","Project Work","Company challenges","Company visits for educational purposes","Talks by professionals","Joint school–company labs","Co-design of learning pathways with companies","Training of company tutors","Teacher placements in companies","Situation-based teaching","Business simulation / practice firm","Other (please specify)"];
const SCALE=["Initial","Basic","Intermediate","Advanced"];
const state={profile:{},scores:{},evid:{},dev:{},reflect:{},plan:{},check:{},plantable:{}};
let step=0; const TOTAL=9;

function elProfile(){
 const f=[["name","Name"],["subject","Subject(s)"],["track","Study pathway"],["years","Years of teaching"],["exp","Experience with companies"],["goals","Professional goals for the year"]];
 return `<h1>Teacher Self-Assessment on Work-Based Learning Competences</h1>
 <p class="sub">A tool for self-assessment, planning and professional improvement for teachers involved in Work-Based Learning pathways and the co-design of learning pathways with companies.</p>
 <h3 style="font-family:Fraunces;font-weight:500;margin:18px 0 6px">How to use the portfolio</h3><div class="howto">Complete the portfolio at the start of the school year to identify your strengths and areas for improvement. Review it during and at the end of projects to document progress and plan your professional development.</div>
 <h2>Professional profile</h2>
 ${f.map(([k,l])=>`<div class="fld"><label>${l}</label><input type="text" value="${state.profile[k]||''}" oninput="state.profile['${k}']=this.value"></div>`).join('')}`;
}
function elArea(ai){
 const a=AREAS[ai];
 return `<div class="areahead"><span class="an">Area ${ai+1} of 6</span></div><h2>${a.t}</h2>
 <div class="scalekey"><span><b>1</b> Initial</span><span><b>2</b> Basic</span><span><b>3</b> Intermediate</span><span><b>4</b> Advanced</span></div>
 ${a.items.map((q,qi)=>{const key=ai+'-'+qi; const sv=state.scores[key];
   return `<div class="item"><div class="q">${q}</div>
   <div class="scale">${[1,2,3,4].map(v=>`<button data-v="${v}" class="${sv==v?'sel':''}" onclick="setScore('${key}',${v},this)"><span class="lv">${v}</span>${SCALE[v-1]}</button>`).join('')}</div>
   <div class="evid"><div><label>Evidence</label><textarea rows="2" oninput="state.evid['${key}-e']=this.value">${state.evid[key+'-e']||''}</textarea></div><div><label>Improvement actions</label><textarea rows="2" oninput="state.evid['${key}-a']=this.value">${state.evid[key+'-a']||''}</textarea></div></div>
   </div>`;}).join('')}
 <div class="oplist"><div class="opt-t">Operational checklist</div>
   ${[['done','Done'],['sched','To schedule'],['prio','Priority']].map(([ck,lbl])=>`<label class="opt"><input type="checkbox" ${state.check[ai+'-'+ck]?'checked':''} onchange="state.check['${ai+'-'+ck}']=this.checked"> ${lbl}</label>`).join('')}
 </div>`;
}
function elDevices(){
 return `<h2>Knowledge of the main WBL modes</h2>
 <p class="sub">This section helps you reflect on your level of knowledge of the main teaching and organisational modes that characterise Work-Based Learning and school–company collaboration.</p>
 <div class="rubric"><div class="rt">Self-assessment scale</div>
  <div><b>1</b>: I only know its name, or have very limited knowledge of it.</div>
  <div><b>2</b>: I know its purpose and main features.</div>
  <div><b>3</b>: I use it, or I have already taken part in designing it.</div>
  <div><b>4</b>: I can design and coordinate it, and support colleagues in using it.</div></div>
 <div class="devgrid"><table class="dev"><thead><tr><th>Mode</th><th class="lvcell">1</th><th class="lvcell">2</th><th class="lvcell">3</th><th class="lvcell">4</th><th>Experiences already carried out</th><th>Training needs</th></tr></thead><tbody>
 ${DEVICES.map((d,di)=>`<tr><td>${d}</td>${[1,2,3,4].map(v=>`<td class="lvcell"><input type="radio" name="dev${di}" ${state.dev['d'+di]==v?'checked':''} onclick="state.dev['d'+di]=${v}"></td>`).join('')}<td><input type="text" value="${state.dev['e'+di]||''}" oninput="state.dev['e'+di]=this.value"></td><td><input type="text" value="${state.dev['t'+di]||''}" oninput="state.dev['t'+di]=this.value"></td></tr>`).join('')}
 </tbody></table></div>
 <div class="reflect fld"><label>Which modes do I use with most confidence?</label><textarea oninput="state.reflect['r1']=this.value">${state.reflect.r1||''}</textarea></div>
 <div class="reflect fld"><label>Which modes would I like to explore further next school year?</label><textarea oninput="state.reflect['r2']=this.value">${state.reflect.r2||''}</textarea></div>
 <div class="reflect fld"><label>Which training, shadowing or mentoring experiences could help me develop these competences?</label><textarea oninput="state.reflect['r3']=this.value">${state.reflect.r3||''}</textarea></div>`;
}
function elPlan(){
 const q=[["b1","Which competences have I developed most?"],["b2","What difficulties did I encounter?"],["b3","Which relationships with companies do I want to strengthen?"],["b4","What goals am I setting for next year?"]];
 return `<h2>Final review</h2>
 ${q.map(([k,l])=>`<div class="fld reflect"><label>${l}</label><textarea oninput="state.plan['${k}']=this.value">${state.plan[k]||''}</textarea></div>`).join('')}
 <h2>Personal improvement plan</h2>
 <div class="devgrid"><table class="dev"><thead><tr><th>Goal</th><th>Actions</th><th>Deadline</th><th>Success indicators</th></tr></thead><tbody>
 ${[0,1,2,3,4].map(r=>`<tr>${['g','a','d','i'].map(c=>`<td><input type="text" value="${state.plantable[r+c]||''}" oninput="state.plantable['${r+c}']=this.value"></td>`).join('')}</tr>`).join('')}
 </tbody></table></div>
 <div class="rubric"><div class="rt">Overall self-assessment rubric</div>
  <div><b>1 Initial:</b> Collaboration with companies is occasional and mainly organisational.</div>
  <div><b>2 Basic:</b> I take part in implementing pathways and keep in touch with some companies.</div>
  <div><b>3 Intermediate:</b> I co-design training activities and use Work-Based Learning methods.</div>
  <div><b>4 Advanced:</b> I coordinate regional networks, innovate teaching and promote stable partnerships.</div></div>`;
}
function elResult(){
 let rows='';
 AREAS.forEach((a,ai)=>{
  let sum=0,n=0; a.items.forEach((_,qi)=>{const v=state.scores[ai+'-'+qi]; if(v){sum+=+v;n++;}});
  const avg=n?(sum/n):0; const pct=avg/4*100;
  const col=avg?`var(--l${Math.round(avg)||1})`:'var(--line-strong)';
  rows+=`<div class="bar"><div class="lbl">${a.t}</div><div class="track"><div class="fill" style="width:${pct}%;background:${col}"></div></div><div class="val">${avg?avg.toFixed(1):'–'}</div></div>`;
 });
 return `<div class="result show"><h1>Your profile</h1><p class="sub">A mirror of your self-assessment across the six areas — an average score per area (1–4). This is a reflection tool, not a grade.</p>
 ${rows}
 <p class="note">Nothing is saved on the platform. Use “Print / save my profile” below to keep a copy.</p>
 <div class="nav"><button class="prev" onclick="go(${TOTAL-1})">‹ Back</button><button class="printbtn" onclick="window.print()">Print / save my profile ⎙</button></div></div>`;
}
function render(){
 const m=document.getElementById('main'); let html='';
 if(step===0) html=`<div class="step show">${elProfile()}</div>`;
 else if(step>=1&&step<=6) html=`<div class="step show">${elArea(step-1)}</div>`;
 else if(step===7) html=`<div class="step show">${elDevices()}</div>`;
 else if(step===8) html=`<div class="step show">${elPlan()}</div>`;
 else if(step===9){ m.innerHTML=elResult(); updateProg(); return; }
 html+=`<div class="nav"><button class="prev" onclick="go(${step-1})" ${step===0?'disabled':''}>‹ Back</button><button class="next" onclick="go(${step+1})">${step===8?'See my profile ›':'Next ›'}</button></div>`;
 m.innerHTML=html; updateProg(); window.scrollTo(0,0);
}
function go(s){ step=Math.max(0,Math.min(TOTAL,s)); render(); }
function setScore(k,v,btn){ state.scores[k]=v; btn.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('sel')); btn.classList.add('sel'); }
function updateProg(){ const p=Math.min(step/TOTAL*100,100); document.getElementById('prog').style.width=p+'%'; document.getElementById('progtxt').textContent= step>=TOTAL?'Profile ready':'Step '+(step+1)+' of '+TOTAL; }
function toggleTheme(){const r=document.documentElement;const dark=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme:dark)').matches);r.setAttribute('data-theme',dark?'light':'dark');document.getElementById('tglIcon').textContent=dark?'🌙':'☀️';document.getElementById('tglTxt').textContent=dark?'Dark':'Light';}
render();
</script>
</body>
</html>
