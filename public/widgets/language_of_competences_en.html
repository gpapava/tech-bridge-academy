<script>
const D={"bloom": [["Remember", "recognise, list, identify, recall"], ["Understand", "describe, interpret, illustrate, summarise"], ["Apply", "use, perform, apply, carry out"], ["Analyse", "analyse, compare, classify, identify"], ["Evaluate", "verify, evaluate, check, justify"], ["Create", "design, develop, propose, produce solutions"]], "translator": [["Prepare a CNC machine for a machining operation", "Set up a CNC machine tool, configuring the tools and machining parameters in compliance with company procedures and safety regulations.", "the observable verb, the configuration, and the company procedures and safety rules"], ["Carry out a dimensional check of parts", "Perform the dimensional check of components using the appropriate measuring instruments, interpreting the results and verifying conformity with the technical specifications.", "the measuring instruments, the interpretation of results and the check against specifications"], ["Assemble a mechanical unit", "Assemble mechanical units following the technical drawing and the assembly procedures, checking that they work correctly.", "the reference documents and the final functional check"], ["Wire an electrical panel", "Wire an electrical panel applying the wiring diagrams and complying with technical and safety standards.", "the diagrams applied and the technical and safety standards"], ["Diagnose a fault", "Identify the causes of a malfunction through systematic diagnostic procedures, proposing the most appropriate interventions.", "the systematic method and the decision to propose interventions"], ["Program a collaborative robot", "Configure and program a robotic system to carry out simple production operations, checking that it works correctly.", "the purpose of the programming and the functional check"], ["Carry out machine maintenance", "Plan and carry out routine maintenance interventions in compliance with company procedures, identifying any anomalies.", "planning, the type of maintenance, procedures and detection of anomalies"], ["Update technical documentation", "Draw up and update the technical documentation relating to the machining or interventions carried out, using the company's IT tools.", "what the documentation refers to and the tools used"], ["Take part in commissioning a plant", "Collaborate in commissioning activities by checking that the plant works correctly, gathering and interpreting the necessary data.", "the specific contribution: checking, gathering and interpreting data"], ["Collaborate with the production team", "Collaborate with the various operators in the department, sharing information and respecting timings, procedures and responsibilities to achieve the production objectives.", "what collaborating concretely means: sharing, respecting timings and responsibilities, towards an objective"]], "progression": [["Early stage", "School", "Recognises the main components of a mechanical or mechatronic system and describes their function."], ["Early stage", "Company", "Observes the technician during maintenance operations and reconstructs the sequence of the interventions carried out."], ["Intermediate stage", "School", "Identifies the possible causes of a fault and proposes a checking procedure under the teacher's supervision."], ["Intermediate stage", "Company", "Carries out checks and simple verification interventions under the company tutor's supervision."], ["Final stage", "School", "Analyses a malfunction, identifies the cause and defines the restoration procedure autonomously."], ["Final stage", "Company", "Carries out the diagnosis, performs the restoration intervention, checks that the plant works correctly and documents the work done autonomously."]], "prog_target": "Identify the causes of a malfunction of a mechanical or mechatronic system, carry out the necessary checks and apply the restoration procedures, verifying that the system works correctly.", "rubric": [["Problem analysis", ["Recognises the problem only when guided.", "Identifies some possible causes with the tutor's help.", "Analyses the problem following a correct procedure.", "Analyses non-standard situations autonomously, formulating reasoned hypotheses."]], ["Working method", ["Proceeds randomly.", "Follows the instructions received.", "Correctly applies the expected method.", "Adapts the method to the situation, justifying their choices."]], ["Use of technical knowledge", ["Uses the tools only when guided.", "Uses the main tools with supervision.", "Correctly uses tools and technical documentation.", "Autonomously chooses the most appropriate tools and sources."]], ["Quality of the solution", ["Identifies only part of the problem.", "Proposes a simple solution.", "Correctly identifies the cause and carries out the restoration.", "Quickly identifies the causes, evaluates several alternatives and chooses the most effective solution."]], ["Autonomy and responsibility", ["Requires continuous assistance.", "Works with frequent supervision.", "Works autonomously on the assigned activities, respecting procedures and safety.", "Autonomously manages the work, checks the result and reports any critical issues."]]], "rubric_levels": ["Initial", "Basic", "Intermediate", "Advanced"]};
const CH={};
CH[1]={short:"01 · What",html:'<span class="ch-num">Section 01</span><h1 class="ch-title">What are competences?</h1><p class="intro">Competences mean the proven ability to use knowledge, skills and personal, social and methodological abilities in work or study situations and in professional and personal development. Competences are described in terms of responsibility and autonomy.</p><p>We know that WBL experiences allow students to develop two types of competence at the same time: technical-professional ones (hard skills) and transversal ones (soft skills). But which ones to choose? And how? And what level of mastery should be expected?</p><p>We have to ask ourselves: what do we really want our young people to learn? In WBL pathways, defining the objectives must be a process of co-design between school and company. The aim is to ensure that what the student learns at school is aligned with what they will experience in the company.</p><p class="lead">School and company must therefore reach a shared understanding of:</p><ul class="pill-list"><li>What the student is learning at school → the competences they have developed;</li><li>What the company will offer them to do during the placement → the competences they will have to activate and develop.</li></ul><p>Speaking the <b>language of competences</b> makes the dialogue between the two worlds easier: the more they are able to use common references and standards, the more they will be able to understand one another and align.</p><div class="c-euro"><p class="tag">European frame</p><p>This definition follows the European approach (EQF): competences are described in terms of knowledge, skills, and responsibility and autonomy, a shared language across education, training and the labour market.</p></div><h2 class="blk">Let us remember that competences are, at the same time:</h2><div class="t0grid"><div class="t0col"><div class="t0h">As a shared reference</div><ul><li>the essential reference and guiding criterion for training policies at European and international level;</li><li>the key for reading labour-market trends;</li><li>the category and tool for analysing training and professional profiles;</li><li>the focus both for building and for assessing and certifying training pathways.</li></ul></div><div class="t0col"><div class="t0h">As what each actor needs</div><ul><li>what employment services need to check the matching of labour demand and supply;</li><li>what companies need to manage production processes;</li><li>what individuals need to carry out work activities, and the product of those activities;</li><li>the objective of training curricula, and their result.</li></ul></div></div>'};
CH[2]={short:"02 · Identify",html:'<span class="ch-num">Section 02</span><h1 class="ch-title">How to identify the competences to develop</h1><p class="intro">For technical-professional competences you can proceed in two ways.</p><div class="example"><div class="ex-t">Option A: start from the professional profiles</div><p>By asking companies:</p><ul class="pill-list"><li>Which activities does a graduate of our study pathway normally carry out?</li><li>What must they be able to do autonomously?</li><li>Which competences do you consider they must possess?</li></ul></div><div class="example"><div class="ex-t">Option B: start from the traineeship activities (recommended for SMEs)</div><p>By analysing with companies:</p><ul class="pill-list"><li>Which activities will be assigned to the students?</li><li>Which tasks recur most frequently?</li><li>Which competences are needed to carry them out?</li></ul></div><p><b>Note: less is more.</b> It is advisable not to exceed in the number of target competences.</p><h2 class="blk">How to identify the soft skills?</h2><p class="lead">Several available repertoires can be used:</p><ul class="pill-list"><li>The European Council Recommendation on key competences for lifelong learning;</li><li>The World Economic Forum\'s Top 10 competences for the future (2020);</li><li>The Career Management Skills (CMS) model, which defines five areas of competence (as in the framework of the LE.AD.ER Erasmus+ project);</li><li>Sector repertoires on organisational and relational competences, such as those provided by sector federations.</li></ul>'};
CH[3]={short:"03 · Describe",html:'<span class="ch-num">Section 03</span><h1 class="ch-title">How to describe competences</h1><p class="intro">To describe competences we use observable verbs — actions that make it clear what the student must be able to do at the end of the pathway.</p><p>A useful reference is Bloom\'s taxonomy of educational objectives, later revised by Anderson and Krathwohl. It organises cognitive processes into progressive levels of complexity.</p><p class="lead">What kind of action do you want the student to perform? Tap a level to see the verbs you can use:</p><div class="bl-chips" id="blChips"></div><div class="bl-out" id="blOut"></div><p>In short, Bloom\'s taxonomy helps turn generic objectives into observable learning outcomes.</p>'};
CH[4]={short:"★ 04 · Translate",html:'<span class="ch-num">Section 04</span><h1 class="ch-title">From the company\'s words to a competence</h1><p class="intro">How to translate the activities the company proposes into competences the school will certify? Having started from the companies\' demand for competences, this is not too difficult — but the initial indications must be decontextualised to obtain more general descriptions, using the competence reference frameworks.</p><div class="c-euro"><p class="tag">European frame</p><p>European and shared frameworks such as <b>ESCO</b> (occupations and skills), <b>DigComp</b> (digital competence) and <b>EntreComp</b> (entrepreneurship competence) make it possible to describe competences in a common language, recognised across Europe. National and regional frameworks can be used alongside them.</p></div><h2 class="blk">Try it: from words to a competence</h2><p class="lead">Pick an activity the company might describe — see how it becomes a competence:</p><div class="tr-wrap"><div class="tr-left" id="trLeft"></div><div class="tr-right"><div class="tr-panel" id="trPanel"><div class="tr-empty">Select an activity to see how it is rewritten in the language of competences.</div></div></div></div><h2 class="blk">Holding content and method together</h2><p>We can describe objectives so that they hold together both the content of the work (technical competences) and the way it is carried out (soft skills). Some examples:</p><ul class="pill-list"><li>Carries out the registration <i>(technical)</i> within the time strictly needed <i>(organisational)</i> and handling the customer\'s impatience courteously <i>(relational)</i>;</li><li>Checks the functionality of an electrical panel <i>(technical)</i> recording the anomalies found <i>(organisational)</i>;</li><li>Performs the assigned machining on the lathe <i>(technical)</i> and at the end of the work reports to the supervisor on the state of progress <i>(organisational)</i>;</li><li>Takes part in a project kick-off meeting contributing to the search for solutions <i>(relational)</i> with relevant and feasible proposals <i>(technical)</i>.</li></ul>'};
CH[5]={short:"★ 05 · When",html:'<span class="ch-num">Section 05</span><h1 class="ch-title">What to ask, and when</h1><p class="intro">WBL experiences can develop over several years. In the early years an orienting "taste" can be offered; in later years the commitment required can grow along with the student\'s maturity.</p><div class="c-euro"><p class="tag">European frame</p><p>To grade the activities, the levels of the European Qualifications Framework (EQF) are an excellent tool: they help us understand what we can realistically expect at each stage.</p></div><h2 class="blk">See how one competence grows</h2><div class="prog-target"><b>Target competence:</b> '+D.prog_target+'</div><p class="lead">Move through the years and contexts to see how the same competence is phrased:</p><div class="prog-steps" id="progSteps"></div><div id="progOut"></div><p style="margin-top:20px">The increasing difficulty depends not only on the operational content, but also on the conditions: with supervision / autonomously; alone / in a team; applying instructions / seeking solutions; having all the information / drawing it from the analysis of the problem.</p>'};
CH[6]={short:"★ 06 · Assess",html:'<span class="ch-num">Section 06</span><h1 class="ch-title">How to assess competences</h1><p class="intro">If describing a competence means clarifying what the student must be able to do, assessing it means recognising the level of mastery they have actually reached.</p><p class="lead">Assessing competences is a complex activity that requires: considering not only the result but also the process that generated it; and gathering several points of view. Open each theme to read more.</p><details class="acc"><summary>Consider the process, not only the result<span class="chev">›</span></summary><div class="body"><p>Assessing does not simply consist of giving a mark to a performance, but of observing how the student mobilises knowledge, skills and attitudes to tackle real situations, progressively taking on responsibility and autonomy. For this reason, in WBL experiences, assessment cannot be based only on the final result of an activity. It must also consider the process followed, the decisions made, the way of collaborating with others, the ability to face the unexpected and to reflect critically on one\'s own work.</p></div></details><details class="acc"><summary>The three dimensions (trifocal assessment)<span class="chev">›</span></summary><div class="body"><p>Since a competence is a complex reality, it must be observed from different perspectives. According to the principle of trifocal assessment, its development can be analysed through three complementary points of view:</p><ul class="pill-list"><li><b>The subjective dimension:</b> how the student interprets their own learning experience, recognises their strengths and identifies aspects to improve. Tools such as the logbook, self-assessment and debriefing foster awareness and critical reflection.</li><li><b>The intersubjective dimension:</b> gathers the observations of the different people involved in the pathway, such as teachers, company tutors, co-workers and other professionals who had the chance to observe the student during the activities.</li><li><b>The objective dimension:</b> takes into account the observable evidence of the competence, such as the products made, practical tests, authentic tasks, the quality of performance and the results achieved.</li></ul><p>Integrating these three dimensions gives a more complete and balanced assessment than observing a single aspect of the performance.</p></div></details><details class="acc"><summary>Building a common language of assessment<span class="chev">›</span></summary><div class="body"><p>For school and company to assess a competence coherently, they need to share not only the name of the competence but also its operational meaning. The tool that makes this possible is the assessment rubric. A rubric generally describes:</p><ul class="pill-list"><li>the dimensions of the competence, i.e. the fundamental aspects that characterise it;</li><li>the observation criteria, i.e. the elements to focus attention on;</li><li>the indicators, i.e. the observable behaviours that make it possible to recognise the competence in action;</li><li>the levels of mastery, described through progressively more autonomous, effective and responsible behaviours.</li></ul><p>In this way everyone shares the same observation criteria, and the student knows from the start what is expected. The rubric becomes the common reference for all the other assessment tools (observation grids, practical tests, authentic tasks, logbooks, debriefing interviews and self-assessments), ensuring coherence across the whole process.</p></div></details><details class="acc"><summary>How the levels of mastery are assessed, and why rubrics matter<span class="chev">›</span></summary><div class="body"><p>A competence is not present or absent: it develops progressively. For this reason the rubric describes different levels of mastery, which represent the student\'s growth path. The names can vary (for example initial, basic, intermediate and advanced, or numerical levels), but the principle stays the same: to describe clearly what the student is really able to do, with what degree of autonomy, responsibility and quality of performance.</p><p>Using assessment rubrics is one of the main tools for dialogue between school and company. When both contexts use the same language, it becomes easier to design training activities, accompany the student, document learning and certify results transparently. Rubrics are therefore not only an assessment tool, but the meeting point between design, training and certification of competences.</p></div></details><h2 class="blk">Example: a rubric to explore</h2><div class="prog-target"><b>Competence:</b> Identify the causes of a malfunction of a mechanical or mechatronic system, carry out the necessary checks and apply the restoration procedures, verifying that the system works correctly.</div><p class="lead">Tap a dimension to see the four levels of mastery:</p><div class="rub-dims" id="rubDims"></div><h2 class="blk">Observable evidence</h2><p class="lead">The tutor and teacher can gather observations referring, for example, to:</p><div class="evlist"><label><input type="checkbox"> Observation during work</label><label><input type="checkbox"> Authentic task</label><label><input type="checkbox"> Practical test</label><label><input type="checkbox"> Student\'s logbook</label><label><input type="checkbox"> Final debriefing</label><label><input type="checkbox"> Technical documentation produced</label><label><input type="checkbox"> Discussion with the company tutor</label></div><p style="font-size:13.5px;color:var(--ink-soft);font-style:italic">In the printable rubric a space is also foreseen for the company tutor\'s comments.</p><h2 class="blk">Student\'s self-assessment</h2><p class="lead">At the end of the experience, three questions help the student reflect:</p><div class="selfq">What do you think you have learned during this activity?</div><div class="selfq">Which phase did you find most difficult?</div><div class="selfq">What would you do differently next time?</div>'};
function renderNav(){document.getElementById('chapnav').innerHTML=Object.entries(CH).map(([n,c])=>'<button data-ch="'+n+'" onclick="showChap('+n+')">'+c.short+'</button>').join('');}
function showChap(n){document.getElementById('main').innerHTML='<section class="chapter show">'+CH[n].html+'</section>';document.querySelectorAll('.chapnav button').forEach(b=>b.classList.toggle('on',b.dataset.ch==String(n)));window.scrollTo(0,0);if(n==3)initBloom();if(n==4)initTr();if(n==5)initProg();if(n==6)initRubric();}
function initBloom(){document.getElementById('blChips').innerHTML=D.bloom.map((b,i)=>'<button onclick="pickBloom('+i+',this)"><b>'+b[0]+'</b></button>').join('');}
function pickBloom(i,btn){document.querySelectorAll('#blChips button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');const o=document.getElementById('blOut');o.className='bl-out show';o.innerHTML='<div class="bo-lv">'+D.bloom[i][0]+'</div><div class="bo-verbs">'+D.bloom[i][1].split(', ').map(v=>'<span>'+v+'</span>').join('')+'</div>';}
function initTr(){document.getElementById('trLeft').innerHTML='<div class="tr-h">The company says…</div>'+D.translator.map((e,i)=>'<button onclick="pickTr('+i+',this)">'+e[0]+'</button>').join('');}
function pickTr(i,btn){document.querySelectorAll('#trLeft button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');const e=D.translator[i];document.getElementById('trPanel').innerHTML='<div class="tr-block"><div class="tr-says">The company says<b>'+e[0]+'</b></div><div class="tr-flow">↓</div><div class="tr-comp-lab">As a competence</div><div class="tr-comp">'+e[1]+'</div><div class="tr-added"><span class="ta-lab">What is added:</span> '+e[2]+'</div><div class="tr-count">'+(i+1)+' / '+D.translator.length+'</div></div>';}
function initProg(){document.getElementById('progSteps').innerHTML=D.progression.map((p,i)=>'<button onclick="pickProg('+i+',this)">'+p[0]+' · '+p[1]+'</button>').join('');}
function pickProg(i,btn){document.querySelectorAll('#progSteps button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');const p=D.progression[i];document.getElementById('progOut').innerHTML='<div class="prog-out"><div class="po-ctx">'+p[0]+' · '+p[1]+'</div><div class="po-txt">'+p[2]+'</div></div>';}
function initRubric(){const lv=D.rubric_levels;document.getElementById('rubDims').innerHTML=D.rubric.map(r=>'<details class="rub-dim"><summary>'+r[0]+'<span class="chev">›</span></summary><div class="rub-levels">'+r[1].map((t,i)=>'<div class="rub-lvl l'+(i+1)+'"><div class="rl-lab">'+lv[i]+'</div>'+t+'</div>').join('')+'</div></details>').join('');}
function toggleTheme(){const r=document.documentElement;const dark=r.getAttribute('data-theme')==='dark'||(!r.getAttribute('data-theme')&&matchMedia('(prefers-color-scheme:dark)').matches);r.setAttribute('data-theme',dark?'light':'dark');document.getElementById('tglIcon').textContent=dark?'🌙':'☀️';document.getElementById('tglTxt').textContent=dark?'Dark':'Light';}
renderNav();showChap(1);
</script>
